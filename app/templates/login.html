{% extends "base.html" %}
{% block title %}Innskráning – Muninn{% endblock %}
{% block body %}
<div style="position:fixed;top:.6rem;right:1rem;z-index:99;">
    <button class="theme-toggle" onclick="toggleTheme()" title="Ljóst/Dökkt"></button>
</div>
<div class="login-wrap">
    <div class="login-box">
        <h1>Muninn</h1>
        <form method="post" class="login-form">
            <fieldset class="login-role-fieldset">
                <legend class="login-role-legend">Skrá inn sem</legend>
                <label class="login-role-option">
                    <input type="radio" name="role" value="notandi" checked>
                    <span><strong>Notandi</strong> — afgreiðsla, nýjar pantanir</span>
                </label>
                <label class="login-role-option">
                    <input type="radio" name="role" value="stjori">
                    <span><strong>Stjóri</strong> — fullur aðgangur</span>
                </label>
            </fieldset>
            <label for="password" class="login-password-label">Lykilorð</label>
            <input type="password" id="password" name="password" placeholder="Lykilorð" required>
            <button type="submit" class="btn btn-primary login-submit">Skrá inn</button>
        </form>
        <p class="login-track-link">
            <a href="{{ url_for('track') }}">Ertu viðskiptavinur að leita að pöntun?</a>
        </p>
    </div>
</div>
{% endblock %}
