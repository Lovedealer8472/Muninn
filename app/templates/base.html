<!DOCTYPE html>
<html lang="is"{% if pwa_enabled %} data-pwa-enabled="1"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Muninn{% endblock %}</title>
    {% if pwa_enabled %}
    <link rel="manifest" href="{{ url_for('pwa_manifest') }}">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Muninn">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='pwa-icon-192.png') }}">
    {% endif %}
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
    (function(){
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
    </script>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
            <div class="flash {{ category }}">{{ msg }}</div>
        {% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
    <script>
    function toggleTheme() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
        setThemeIcons();
    }
    function setThemeIcons() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.querySelectorAll('.theme-toggle').forEach(function(b){
            b.textContent = isDark ? '\u2600' : '\u263E';
        });
    }
    setThemeIcons();

    // Random Muninn Quotes
    var quotes = [
        "Óðinn mælir með þessu kerfi.",
        "Muninn flýgur með fréttirnar.",
        "Valhöll notar ekki lengur Excel.",
        "Ekkert Ragnarök í dag, pantanirnar eru í öruggum höndum.",
        "Muninn sér allt. Líka þegar þú gleymdir að hringja í Jón.",
        "Töluvert áreiðanlegra en bréfdúfa.",
        "Sleipnir var fljótur, en Muninn sendir póstinn strax.",
        "Post-it miðar eru til að teikna kalla.",
        "Engir post-it miðar slösuðust við gerð þessa kerfis.",
        "Áfram með smjörið (og pantanirnar).",
        "Þetta reddast. Sérstaklega þegar það er skráð hér.",
        "Tölvan segir já.",
        "Trix: Prentaðu límmiða beint á pakkann úr pöntuninni.",
        "Trix: Færðu pöntunina í 'Komið' og Muninn sendir póst.",
        "Trix: Kúnninn óþolinmóður? Merktu pöntunina 'Brýnt'.",
        "Krunk.",
        "*Vængjasláttur*",
        "Gefðu mér brauðmola og ég sendi póstinn."
    ];
    
    // Inject quote next to the brand wrap
    var brandWrap = document.querySelector('.brand-wrap');
    if (brandWrap) {
        var quoteEl = document.createElement('span');
        quoteEl.className = 'header-quote';
        quoteEl.textContent = quotes[Math.floor(Math.random() * quotes.length)];
        brandWrap.parentNode.insertBefore(quoteEl, brandWrap.nextSibling);
    }

    var cawAudio = null;
    var clickCount = 0;
    var clickTimer = null;
    
    function cawCaw(e) {
        if(e) e.preventDefault();
        var img = e.target;
        
        clickCount++;
        clearTimeout(clickTimer);
        
        // Reset counter if not clicked again within 1.5 seconds
        clickTimer = setTimeout(function() { 
            clickCount = 0; 
        }, 1500);

        if (clickCount >= 3) {
            clickCount = 0; // Reset after successful trigger
            if(img.classList.contains('flapping')) return;
            
            img.classList.add('flapping');
            setTimeout(function() { img.classList.remove('flapping'); }, 500);
            
            try {
                if (!cawAudio) {
                    // Using a reliable MP3 fallback from a sound effects library
                    cawAudio = new Audio('https://cdn.pixabay.com/download/audio/2022/03/15/audio_24855734bc.mp3?filename=crow-caw-83269.mp3');
                    cawAudio.volume = 0.5;
                }
                cawAudio.currentTime = 0;
                var playPromise = cawAudio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function(err) { console.log("Audio play blocked", err); });
                }
            } catch (e) {
                console.log("Audio failed", e);
            }
        }
    }
    </script>
    {% if pwa_enabled %}
    <script src="{{ url_for('static', filename='pwa.js') }}" defer></script>
    {% endif %}
</body>
</html>
